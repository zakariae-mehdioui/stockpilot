# Server
server.port=8080
server.servlet.context-path=/api

# Database (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventory}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:stockpilot-super-secret-key-change-in-production-at-least-32-chars}
app.jwt.expiration-ms=86400000
app.jwt.issuer=stockpilot

# Default admin bootstrap user (created on first startup)
app.security.bootstrap-admin-email=${ADMIN_EMAIL:admin@stockpilot.io}
app.security.bootstrap-admin-password=${ADMIN_PASSWORD:Admin@12345}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.stockpilot=DEBUG
logging.level.org.hibernate.SQL=WARN
